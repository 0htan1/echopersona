<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ec">
<meta name="description" content="EchoPersona — 用你自己的聊天记录构建 AI 人格，支持长期记忆与语音对话。">
<title>EchoPersona</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171310'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%23f6f2ec' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <div style="display:grid;place-items:center;min-height:100vh">
    <div style="text-align:center">
      <div style="width:34px;height:34px;border:2px solid #b8491f;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px"></div>
      <div style="font-family:-apple-system,sans-serif;font-size:13px;color:#9a8f84">正在加载…</div>
      <div id="boot-fallback" hidden style="font-family:-apple-system,sans-serif;max-width:460px;margin:22px auto 0;padding:0 18px;text-align:left">
        <div style="font-size:13px;color:#b8491f;margin-bottom:8px">页面没能启动</div>
        <pre id="boot-fallback-msg" style="font-size:12px;line-height:1.6;color:#6b6259;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #e6ddd2;border-radius:8px;padding:10px 12px;margin:0 0 12px"></pre>
        <a href="" style="display:inline-block;font-size:13px;padding:7px 14px;border-radius:7px;border:1px solid #d8cec1;background:#fff;cursor:pointer;color:#171310;text-decoration:none">重新加载</a>
      </div>
    </div>
  </div>
</div>
<noscript>
  <div style="padding:40px;text-align:center;font-family:sans-serif">
    EchoPersona 需要启用 JavaScript 才能运行。
  </div>
</noscript>
<script src="/js/boot-watchdog.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
